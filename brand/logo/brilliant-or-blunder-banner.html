<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url(Anton-Regular.ttf)}
@font-face{font-family:Inter;src:url(Inter.ttf)}
html,body{margin:0;width:2560px;height:1440px;overflow:hidden}
body{background:radial-gradient(ellipse 1300px 520px at 50% 50%,#33302a 0%,#262421 45%,#141312 100%);position:relative;font-family:Inter}
.grid{position:absolute;inset:0;background-image:linear-gradient(45deg,rgba(255,255,255,.025) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.025) 75%),linear-gradient(45deg,rgba(255,255,255,.025) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.025) 75%);background-size:160px 160px;background-position:0 0,80px 80px;
 -webkit-mask:radial-gradient(ellipse 1100px 420px at 50% 50%,transparent 40%,#000 100%)}
.wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:34px}
.badge{width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Anton;font-size:96px;color:#fff;box-shadow:0 10px 28px rgba(0,0,0,.55);border:10px solid #141312;letter-spacing:-.02em}
.b1{background:#26C2A3}.b2{background:#D63A2F}
.word{display:flex;flex-direction:column;align-items:center}
.wm{font-family:Anton;font-size:132px;line-height:1;letter-spacing:.015em;color:#fff;text-transform:uppercase;white-space:nowrap;text-shadow:0 0 60px rgba(232,176,74,.25)}
.wm .t{color:#26C2A3}.wm .r{color:#D63A2F}.wm .o{color:#E8B04A;font-size:84px;vertical-align:12px;margin:0 22px}
.tag{margin-top:22px;font-size:34px;font-weight:500;color:#B9B4AC}
.tag b{color:#E8B04A;font-weight:600}
</style></head><body><div class="grid"></div>
<div class="wrap"><div class="badge b1">!!</div>
<div class="word"><div class="wm"><span class="t">Brilliant</span><span class="o">or</span><span class="r">Blunder</span></div>
<div class="tag">Movie and TV scenes, <b>graded move by move like chess.</b></div></div>
<div class="badge b2">??</div></div></body></html>
